<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="scanlines"></div>
    
    <div class="container">
        <header class="glitch-wrapper">
            <h1 class="glitch" data-text="Chaos AI Studio">Chaos AI <span>Studio</span></h1>
            <p class="cyber-subtitle">Unified Command Center [SYSTEM: ACTIVE]</p>
        </header>

        <main>
            <section class="panel services-panel">
                <h2>AI Services</h2>
                <div class="service-grid" id="service-grid">
                    <!-- Services injected by JS -->
                </div>
            </section>

            <section class="panel catalogue-panel">
                <h2>Model Catalogue</h2>
                <p style="color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.95rem;">Curated models optimized for 4GB VRAM. One click to download.</p>
                <div class="catalogue-grid" id="catalogue-grid">
                    <!-- Catalogue injected by JS -->
                </div>
            </section>

            <section class="panel models-panel">
                <h2>Your Local Models</h2>
                <div class="table-container">
                    <table id="models-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Size</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Models injected by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script>
        const services = [
            { id: 'llama', name: 'Text AI (Llama)', url: 'http://localhost:3000' },
            { id: 'comfyui', name: 'Image AI (ComfyUI)', url: 'http://localhost:8188' },
            { id: 'musicgen', name: 'Audio AI (MusicGen)', url: 'http://localhost:7860' },
            { id: 'xtts', name: 'Voice Cloning (XTTS)', url: 'http://localhost:8020' }
        ];

        let pendingStarts = new Set();
        let pendingStops = new Set();
        let lastStatus = {};

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${isError ? 'error' : ''} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                // Clear pending states if status matches
                services.forEach(s => {
                    const isRunning = data[s.id]?.running;
                    if (isRunning) pendingStarts.delete(s.id);
                    if (!isRunning) pendingStops.delete(s.id);
                });
                
                lastStatus = data;
                renderServices(data);
            } catch (e) {
                console.error("Failed to fetch status");
            }
        }

        async function toggleService(id, isCurrentlyRunning) {
            if (isCurrentlyRunning) {
                pendingStops.add(id);
            } else {
                pendingStarts.add(id);
            }
            renderServices(lastStatus); // update UI to show loading state immediately
            
            const endpoint = isCurrentlyRunning ? `/api/stop/${id}` : `/api/start/${id}`;
            try {
                const res = await fetch(endpoint, { method: 'POST' });
                const data = await res.json();
                if (!res.ok) {
                    showToast(data.error, true);
                    pendingStarts.delete(id);
                    pendingStops.delete(id);
                    renderServices(lastStatus);
                } else {
                    showToast(isCurrentlyRunning ? `Stopping ${id}...` : `Starting ${id}...`);
                }
            } catch (e) {
                showToast("Connection error.", true);
                pendingStarts.delete(id);
                pendingStops.delete(id);
                renderServices(lastStatus);
            }
        }

        function renderServices(statusData) {
            const grid = document.getElementById('service-grid');
            grid.innerHTML = '';
            
            services.forEach(s => {
                const isRunning = statusData[s.id]?.running || false;
                const isStarting = pendingStarts.has(s.id);
                const isStopping = pendingStops.has(s.id);
                
                const card = document.createElement('div');
                card.className = `service-card ${isRunning && !isStopping ? 'running' : ''} ${(isStarting || isStopping) ? 'loading' : ''}`;
                
                let btnText = isRunning ? 'Stop' : 'Start';
                if (isStarting) btnText = 'Starting...';
                if (isStopping) btnText = 'Stopping...';
                
                let btnDisabled = (isStarting || isStopping) ? 'disabled' : '';

                card.innerHTML = `
                    <div class="service-header">
                        <h3>${s.name}</h3>
                        <div class="status-indicator"></div>
                    </div>
                    <div class="service-actions">
                        <button class="btn primary" onclick="toggleService('${s.id}', ${isRunning})" ${btnDisabled}>
                            ${btnText}
                        </button>
                        ${(isRunning && !isStopping) ? `<a href="${s.url}" target="_blank" class="btn secondary">Open</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function fetchModels() {
            try {
                const res = await fetch('/api/models');
                const data = await res.json();
                const tbody = document.querySelector('#models-table tbody');
                tbody.innerHTML = '';
                
                data.forEach(m => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${m.name}</td>
                            <td><span class="badge ${m.type.includes('Text') ? 'text' : 'image'}">${m.type}</span></td>
                            <td>${m.size}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error("Failed to fetch models");
            }
        }

        async function fetchCatalogue() {
            try {
                const res = await fetch('/api/catalogue');
                const data = await res.json();
                const grid = document.getElementById('catalogue-grid');
                grid.innerHTML = '';
                
                data.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'catalogue-card';
                    
                    let btnHtml = '';
                    if (m.is_downloaded) {
                        btnHtml = `<button class="btn secondary" disabled>Downloaded</button>`;
                    } else if (m.is_downloading) {
                        btnHtml = `<button class="btn secondary" disabled>Downloading...</button>`;
                    } else {
                        btnHtml = `<button class="btn primary" onclick="downloadModel('${m.id}')">Download</button>`;
                    }

                    card.innerHTML = `
                        <div class="cat-header">
                            <h3>${m.name}</h3>
                            <span class="badge ${m.type.includes('Text') ? 'text' : 'image'}">${m.type}</span>
                        </div>
                        <p class="cat-desc">${m.description}</p>
                        <div class="cat-actions">
                            ${btnHtml}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                console.error("Failed to fetch catalogue");
            }
        }

        async function downloadModel(id) {
            try {
                const res = await fetch(`/api/download/${id}`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    showToast("Download started!");
                    fetchCatalogue();
                } else {
                    showToast(data.error, true);
                }
            } catch (e) {
                showToast("Connection error.", true);
            }
        }

        // Initialize
        fetchStatus();
        fetchModels();
        fetchCatalogue();
        
        setInterval(fetchStatus, 2000);
        setInterval(fetchCatalogue, 5000);
        setInterval(fetchModels, 10000);
    </script>
</body>
</html>
