{% extends "base.html" %}

{% block content %}
<header>
    <div>
        <svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="44" stroke="#a3e635" stroke-width="6" stroke-dasharray="200 280" stroke-linecap="round" transform="rotate(45 50 50)"/>
            <circle cx="50" cy="50" r="28" stroke="#f97316" stroke-width="6" stroke-dasharray="100 180" stroke-linecap="round" transform="rotate(225 50 50)"/>
            <circle cx="50" cy="50" r="10" fill="#a3e635"/>
        </svg>
    </div>
    <div>
        <h1>AI Management Hub</h1>
        <p>Manage your localized AI instances with zero friction.</p>
    </div>
</header>

<section class="panel monitor-panel">
    <h2>System Telemetry</h2>
    <div class="monitor-grid">
        <div class="monitor-card">
            <span class="monitor-label">CPU Usage</span>
            <span class="monitor-value" id="cpu-val">0%</span>
            <div class="progress-bar"><div class="progress-fill" id="cpu-fill" style="width: 0%"></div></div>
        </div>
        <div class="monitor-card">
            <span class="monitor-label">RAM Usage</span>
            <span class="monitor-value" id="ram-val">0GB / 0GB</span>
            <div class="progress-bar"><div class="progress-fill" id="ram-fill" style="width: 0%"></div></div>
        </div>
        <div class="monitor-card">
            <span class="monitor-label">Swap Memory</span>
            <span class="monitor-value" id="swap-val">0GB / 0GB</span>
            <div class="progress-bar"><div class="progress-fill" id="swap-fill" style="width: 0%"></div></div>
        </div>
        <div class="monitor-card">
            <span class="monitor-label">GPU VRAM Usage</span>
            <span class="monitor-value" id="gpu-val">0GB / 4GB</span>
            <div class="progress-bar"><div class="progress-fill" id="gpu-fill" style="width: 0%"></div></div>
        </div>
    </div>
</section>

<section class="panel">
    <h2>Active Services</h2>
    <div class="service-grid" id="service-grid">
        <!-- Services injected by JS -->
    </div>
</section>

<!-- Settings Modal -->
<dialog id="settings-modal">
    <h2 id="settings-title" style="margin-bottom: 1rem;">Settings</h2>
    <div id="settings-body" style="display: flex; flex-direction: column; gap: 1rem;">
        <!-- Dynamic forms injected here -->
    </div>
    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <button class="btn secondary" style="flex: 1;" onclick="document.getElementById('settings-modal').close()">Cancel</button>
        <button class="btn primary" style="flex: 1;" onclick="saveSettings()">Save</button>
    </div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
    const services = [
        { id: 'llama', name: 'Text AI (Llama)', url: 'http://localhost:3000' },
        { id: 'comfyui', name: 'Image AI (ComfyUI)', url: 'http://localhost:8188' },
        { id: 'wan_video', name: 'Video AI (Wan2.2)', url: 'http://localhost:8188' },
        { id: 'musicgen', name: 'Audio AI (MusicGen)', url: 'http://localhost:7860' },
        { id: 'xtts', name: 'Voice Cloning (XTTS)', url: 'http://localhost:8020' },
        { id: 'text2speach', name: 'TTS (VibeVoice)', url: 'http://localhost:8090' }
    ];

    let lastStatus = {};
    const pendingStarts = new Set();
    const pendingStops = new Set();
    let textModels = [];
    let appConfig = {};
    let currentEditingService = null;

    async function init() {
        await fetchConfig();
        await fetchTextModels();
        fetchStatus();
        fetchSystem();
        setInterval(fetchStatus, 2000);
        setInterval(fetchSystem, 1000);
    }

    async function fetchConfig() {
        try {
            const res = await fetch('/api/config');
            appConfig = await res.json();
        } catch (e) { console.error("Config fetch error", e); }
    }

    async function saveSettings() {
        if (!currentEditingService) return;
        
        const body = document.getElementById('settings-body');
        const inputs = body.querySelectorAll('input');
        
        let newConfig = { ...appConfig };
        if (!newConfig[currentEditingService]) newConfig[currentEditingService] = {};
        
        inputs.forEach(inp => {
            if (inp.type === 'checkbox') {
                newConfig[currentEditingService][inp.name] = inp.checked;
            } else {
                newConfig[currentEditingService][inp.name] = isNaN(inp.value) ? inp.value : Number(inp.value);
            }
        });

        try {
            await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newConfig)
            });
            appConfig = newConfig;
            document.getElementById('settings-modal').close();
            showToast("Settings saved!");
        } catch (e) {
            showToast("Error saving settings", true);
        }
    }

    function openSettings(serviceId) {
        currentEditingService = serviceId;
        const modal = document.getElementById('settings-modal');
        const title = document.getElementById('settings-title');
        const body = document.getElementById('settings-body');
        
        title.innerText = `${services.find(s => s.id === serviceId)?.name || serviceId} Settings`;
        body.innerHTML = '';
        
        const conf = appConfig[serviceId] || {};
        
        if (serviceId === 'llama') {
            body.innerHTML = `
                <label>Context Size (--ctx-size)</label>
                <input type="number" name="ctx_size" value="${conf.ctx_size || 4096}" class="model-select" style="margin-bottom:0.5rem;">
                <label>GPU Layers (-ngl)</label>
                <input type="number" name="ngl" value="${conf.ngl || 99}" class="model-select" style="margin-bottom:0.5rem;">
                <label>Threads (-t)</label>
                <input type="number" name="threads" value="${conf.threads || 4}" class="model-select" style="margin-bottom:0.5rem;">
                <label>Port</label>
                <input type="number" name="port" value="${conf.port || 8080}" class="model-select">
            `;
        } else if (serviceId === 'comfyui') {
            body.innerHTML = `
                <label style="display:flex; align-items:center; gap:0.5rem;">
                    <input type="checkbox" name="lowvram" ${conf.lowvram ? 'checked' : ''}> Use --lowvram
                </label>
                <label style="display:flex; align-items:center; gap:0.5rem; margin-top:0.5rem;">
                    <input type="checkbox" name="normalvram" ${conf.normalvram ? 'checked' : ''}> Use --normalvram
                </label>
            `;
        } else if (serviceId === 'text2speach') {
            body.innerHTML = `
                <label>Context Size (--ctx-size)</label>
                <input type="number" name="ctx_size" value="${conf.ctx_size || 1024}" class="model-select" style="margin-bottom:0.5rem;">
                <label>GPU Layers (-ngl)</label>
                <input type="number" name="ngl" value="${conf.ngl || 99}" class="model-select" style="margin-bottom:0.5rem;">
                <label>Threads (-t)</label>
                <input type="number" name="threads" value="${conf.threads || 4}" class="model-select" style="margin-bottom:0.5rem;">
                <label>Port</label>
                <input type="number" name="port" value="${conf.port || 8090}" class="model-select">
            `;
        } else {
            body.innerHTML = '<p>No specific settings available for this service.</p>';
        }
        
        modal.showModal();
    }

    async function fetchSystem() {
        try {
            const res = await fetch('/api/system');
            const data = await res.json();
            document.getElementById('cpu-val').innerText = `${data.cpu_percent}%`;
            document.getElementById('cpu-fill').style.width = `${data.cpu_percent}%`;
            
            document.getElementById('ram-val').innerText = `${data.ram_used_gb}GB / ${data.ram_total_gb}GB`;
            document.getElementById('ram-fill').style.width = `${data.ram_percent}%`;
            
            document.getElementById('swap-val').innerText = `${data.swap_used_gb}GB / ${data.swap_total_gb}GB`;
            document.getElementById('swap-fill').style.width = `${data.swap_percent}%`;
            
            document.getElementById('gpu-val').innerText = `${data.gpu_used_gb}GB / ${data.gpu_total_gb}GB`;
            document.getElementById('gpu-fill').style.width = `${data.gpu_vram_percent}%`;
            
            if (data.ram_percent > 90) {
                document.getElementById('ram-fill').style.background = 'var(--danger)';
            } else {
                document.getElementById('ram-fill').style.background = 'var(--primary)';
            }
            
            if (data.gpu_vram_percent > 90) {
                document.getElementById('gpu-fill').style.background = 'var(--danger)';
            } else {
                document.getElementById('gpu-fill').style.background = 'var(--primary)';
            }
        } catch (e) {
            console.error("System fetch error", e);
        }
    }

    async function fetchTextModels() {
        try {
            const res = await fetch('/api/models/text');
            textModels = await res.json();
        } catch(e) {
            console.error("Model fetch error", e);
        }
    }

    async function fetchStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            
            services.forEach(s => {
                const isRunning = data[s.id]?.running;
                const wasPending = pendingStarts.has(s.id) || pendingStops.has(s.id);
                if (isRunning) pendingStarts.delete(s.id);
                if (!isRunning) pendingStops.delete(s.id);
                // Force a re-render if a pending state just cleared
                if (wasPending && !pendingStarts.has(s.id) && !pendingStops.has(s.id)) {
                    lastRenderState = "";
                }
            });

            lastStatus = data;
            renderServices(data);
        } catch (e) {
            console.error("Status fetch error", e);
        }
    }

    async function toggleService(id) {
        const isCurrentlyRunning = lastStatus[id]?.running || false;
        
        let endpoint = `/api/${isCurrentlyRunning ? 'stop' : 'start'}/${id}`;
        
        pendingStarts.delete(id);
        pendingStops.delete(id);
        
        if (isCurrentlyRunning) {
            pendingStops.add(id);
        } else {
            pendingStarts.add(id);
        }
        
        renderServices(lastStatus);

        try {
            let reqOptions = { method: 'POST' };
            const res = await fetch(endpoint, reqOptions);
            const data = await res.json();
            if (!res.ok) {
                showToast(data.error || 'Operation failed', true);
                pendingStarts.delete(id);
                pendingStops.delete(id);
                renderServices(lastStatus);
            } else {
                const friendlyName = services.find(s => s.id === id)?.name || id;
                showToast(isCurrentlyRunning ? `Stopping ${friendlyName}...` : `Starting ${friendlyName}...`);
            }
        } catch (e) {
            showToast("Connection error.", true);
            pendingStarts.delete(id);
            pendingStops.delete(id);
            renderServices(lastStatus);
        }
    }

    async function forceStop(id) {
        pendingStarts.delete(id);
        pendingStops.delete(id);
        lastRenderState = "";
        renderServices(lastStatus);
        showToast(`Force stopping ${id}...`);
        try {
            await fetch(`/api/stop/${id}`, { method: 'POST' });
        } catch (e) {
            console.error(e);
        }
        fetchStatus();
    }

    let lastRenderState = "";

    function renderServices(statusData) {
        const grid = document.getElementById('service-grid');
        
        // Calculate current state fingerprint
        const currentState = services.map(s => {
            const isRunning = statusData[s.id]?.running || false;
            const isStarting = pendingStarts.has(s.id);
            const isStopping = pendingStops.has(s.id);
            return `${s.id}:${isRunning}:${isStarting}:${isStopping}`;
        }).join('|');
        
        // Only re-render if state changed or we haven't rendered yet
        if (currentState === lastRenderState && grid.innerHTML !== '') {
            return;
        }
        lastRenderState = currentState;
        
        grid.innerHTML = '';
        
        services.forEach(s => {
            const isRunning = statusData[s.id]?.running || false;
            const isStarting = pendingStarts.has(s.id);
            const isStopping = pendingStops.has(s.id);
            
            const card = document.createElement('div');
            card.className = `service-card ${isRunning && !isStopping ? 'running' : ''} ${(isStarting || isStopping) ? 'loading' : ''}`;
            
            let btnText = isRunning ? 'Stop' : 'Start';
            if (isStarting) btnText = 'Starting...';
            if (isStopping) btnText = 'Stopping...';
            
            let btnDisabled = (isStarting || isStopping) ? 'disabled' : '';

            card.innerHTML = `
                <div class="service-header">
                    <h3>${s.name}</h3>
                    <div style="display:flex; gap:1rem; align-items:center;">
                        <button class="settings-btn" onclick="toggleLogs('${s.id}', '${s.name}')" title="Logs">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        </button>
                        <button class="settings-btn gear-btn" onclick="openSettings('${s.id}')" title="Settings">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        </button>
                        <div class="status-indicator"></div>
                    </div>
                </div>
                <div class="service-actions" style="display:flex; gap:0.5rem; width:100%;">
                    <button class="btn primary" style="flex:1;" onclick="toggleService('${s.id}')" ${btnDisabled}>${btnText}</button>
                    ${(isStarting || isStopping || isRunning) ? `<button class="btn force-stop-btn" onclick="forceStop('${s.id}')" title="Force Kill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>` : ''}
                    ${(isRunning && !isStopping) ? `<a href="${s.url}" target="_blank" class="btn secondary">Open</a>` : ''}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    init();
</script>
{% endblock %}
