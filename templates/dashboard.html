{% extends "base.html" %}

{% block content %}
<header>
    <div>
        <svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="44" stroke="#a3e635" stroke-width="6" stroke-dasharray="200 280" stroke-linecap="round" transform="rotate(45 50 50)"/>
            <circle cx="50" cy="50" r="28" stroke="#f97316" stroke-width="6" stroke-dasharray="100 180" stroke-linecap="round" transform="rotate(225 50 50)"/>
            <circle cx="50" cy="50" r="10" fill="#a3e635"/>
        </svg>
    </div>
    <div>
        <h1>AI Management Hub</h1>
        <p>Manage your local AI stack with zero friction.</p>
    </div>
</header>

<section class="panel monitor-panel">
    <h2>System Telemetry</h2>
    <div class="monitor-grid">
        <div class="monitor-card">
            <span class="monitor-label">CPU Usage</span>
            <span class="monitor-value" id="cpu-val">0%</span>
            <div class="progress-bar"><div class="progress-fill" id="cpu-fill" style="width:0%"></div></div>
        </div>
        <div class="monitor-card">
            <span class="monitor-label">RAM Usage</span>
            <span class="monitor-value" id="ram-val">0GB / 0GB</span>
            <div class="progress-bar"><div class="progress-fill" id="ram-fill" style="width:0%"></div></div>
        </div>
        <div class="monitor-card">
            <span class="monitor-label">Swap Memory</span>
            <span class="monitor-value" id="swap-val">0GB / 0GB</span>
            <div class="progress-bar"><div class="progress-fill" id="swap-fill" style="width:0%"></div></div>
        </div>
        <div class="monitor-card">
            <span class="monitor-label">GPU VRAM</span>
            <span class="monitor-value" id="gpu-val">0GB / 4GB</span>
            <div class="progress-bar"><div class="progress-fill" id="gpu-fill" style="width:0%"></div></div>
        </div>
    </div>
</section>

<section class="panel">
    <h2>Active Services</h2>
    <div class="service-grid" id="service-grid"><!-- injected by JS --></div>
</section>

<!-- Settings Modal -->
<dialog id="settings-modal">
    <h2 id="settings-title" style="margin-bottom:1.25rem;">Settings</h2>
    <div id="settings-body" style="display:flex;flex-direction:column;gap:1rem;"></div>
    <div style="display:flex;gap:1rem;margin-top:2rem;">
        <button class="btn secondary" style="flex:1;" onclick="document.getElementById('settings-modal').close()">Cancel</button>
        <button class="btn primary" style="flex:1;" onclick="saveSettings()">Save</button>
    </div>
</dialog>
{% endblock %}

{% block scripts %}
<script>
    // ── Service definitions ───────────────────────────────────────────────────
    const services = [
        { id:'llama',       name:'Text AI (Llama)',       url:'http://localhost:8080', supportsChat: true,  gpu: true },
        { id:'comfyui',     name:'Image AI (ComfyUI)',    url:'http://localhost:8188', supportsChat: false, gpu: false },
        { id:'wan_video',   name:'Video AI (Wan2.2)',     url:'http://localhost:8188', supportsChat: false, gpu: false },
        { id:'musicgen',    name:'Audio AI (MusicGen)',   url:'http://localhost:7860', supportsChat: false, gpu: false },
        { id:'text2speach', name:'TTS (VibeVoice)',       url:'http://localhost:8090', supportsChat: false, gpu: true },
        { id:'xtts',        name:'Voice Cloning (XTTS)',  url:'http://localhost:8020', supportsChat: false, gpu: false },
    ];

    // ── State ─────────────────────────────────────────────────────────────────
    let lastStatus             = {};
    let lastRenderKey          = '';
    const pendingStarts        = new Set();
    const pendingStops         = new Set();
    let textModels             = [];
    let audioModels            = [];
    let vulkanDevices          = [];
    let appConfig              = {};
    let currentEditingService  = null;

    // ── Init ──────────────────────────────────────────────────────────────────
    async function init() {
        await Promise.all([fetchConfig(), fetchTextModels(), fetchAudioModels(), fetchVulkanDevices()]);
        fetchStatus();
        fetchSystem();
        setInterval(fetchStatus, 2500);
        setInterval(fetchSystem, 1200);
    }

    async function fetchConfig()  { try { appConfig      = await (await fetch('/api/config')).json();        } catch(e){} }
    async function fetchTextModels()  { try { textModels  = await (await fetch('/api/models/text')).json();  } catch(e){} }
    async function fetchAudioModels() { try { audioModels = await (await fetch('/api/models/audio')).json(); } catch(e){} }
    async function fetchVulkanDevices() { try { vulkanDevices = await (await fetch('/api/gpu/devices')).json(); } catch(e){} }

    // ── System telemetry ──────────────────────────────────────────────────────
    async function fetchSystem() {
        try {
            const d = await (await fetch('/api/system')).json();
            set('cpu-val',  `${d.cpu_percent}%`);
            setWidth('cpu-fill',  d.cpu_percent);
            set('ram-val',  `${d.ram_used_gb}GB / ${d.ram_total_gb}GB`);
            setWidth('ram-fill',  d.ram_percent, d.ram_percent > 90);
            set('swap-val', `${d.swap_used_gb}GB / ${d.swap_total_gb}GB`);
            setWidth('swap-fill', d.swap_percent);
            set('gpu-val',  `${d.gpu_used_gb}GB / ${d.gpu_total_gb}GB`);
            setWidth('gpu-fill',  d.gpu_vram_percent, d.gpu_vram_percent > 85);
        } catch(e) {}
    }
    function set(id, v) { const el = document.getElementById(id); if(el) el.innerText = v; }
    function setWidth(id, pct, danger=false) {
        const el = document.getElementById(id);
        if(!el) return;
        el.style.width = `${Math.min(pct,100)}%`;
        el.style.background = danger ? 'var(--danger)' : 'var(--primary)';
    }

    // ── Status + render ───────────────────────────────────────────────────────
    async function fetchStatus() {
        try {
            const data = await (await fetch('/api/status')).json();
            services.forEach(s => {
                if (data[s.id]?.running)  pendingStarts.delete(s.id);
                if (!data[s.id]?.running) pendingStops.delete(s.id);
            });
            lastStatus = data;
            renderServices(data);
        } catch(e) {}
    }

    function renderServices(statusData) {
        const key = services.map(s => {
            const d = statusData[s.id] || {};
            return `${s.id}:${d.state}:${d.running}:${pendingStarts.has(s.id)}:${pendingStops.has(s.id)}`;
        }).join('|');
        const grid = document.getElementById('service-grid');
        if (key === lastRenderKey && grid.innerHTML !== '') return;
        lastRenderKey = key;
        grid.innerHTML = '';

        services.forEach(s => {
            const d          = statusData[s.id] || {};
            const isRunning  = d.running  || false;
            const state      = d.state    || 'stopped';   // stopped|starting|ready|crashed
            const isStarting = pendingStarts.has(s.id);
            const isStopping = pendingStops.has(s.id);
            const isCrashed  = state === 'crashed' && !isStarting && !isStopping;
            const isReady    = state === 'ready'   && isRunning;

            // Status pill
            let statePill = '';
            if (isCrashed)                 statePill = `<span class="state-pill crashed">⚠ Crashed</span>`;
            else if (isStarting)           statePill = `<span class="state-pill starting">Starting…</span>`;
            else if (isStopping)           statePill = `<span class="state-pill stopping">Stopping…</span>`;
            else if (isReady)              statePill = `<span class="state-pill ready">✓ Ready</span>`;
            else if (isRunning)            statePill = `<span class="state-pill loading">Loading model…</span>`;

            // Model badge from config
            let modelBadge = '';
            const cfg = appConfig[s.id] || {};
            if ((s.id === 'llama' || s.id === 'text2speach') && cfg.model) {
                const mName = cfg.model.replace(/\.gguf$/i,'').replace(/-q\d.*/i,'');
                modelBadge = `<div class="model-badge" title="${cfg.model}">${mName}</div>`;
            }

            // GPU badge
            const gpuBadge = s.gpu ? `<span class="gpu-badge">Vulkan</span>` : '';

            // Button
            let btnText = isRunning ? 'Stop' : 'Start';
            if (isStarting) btnText = 'Starting…';
            if (isStopping) btnText = 'Stopping…';
            const btnDisabled = (isStarting || isStopping) ? 'disabled' : '';

            // Quick-open links
            let quickLinks = '';
            if (isReady) {
                quickLinks = `<a href="${s.url}" target="_blank" class="btn secondary">Open ↗</a>`;
                if (s.supportsChat) quickLinks += `<a href="/chat" class="btn secondary">Chat</a>`;
            }

            const card = document.createElement('div');
            card.className = `service-card ${isRunning && !isStopping ? 'running' : ''} ${isCrashed ? 'crashed' : ''} ${(isStarting||isStopping) ? 'loading' : ''}`;
            card.innerHTML = `
                <div class="service-header">
                    <div style="flex:1;min-width:0;">
                        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
                            <h3 style="margin:0;">${s.name}</h3>
                            ${gpuBadge}
                        </div>
                        ${modelBadge}
                        ${statePill}
                    </div>
                    <div style="display:flex;gap:0.5rem;align-items:center;flex-shrink:0;">
                        <button class="settings-btn" onclick="toggleLogs('${s.id}','${s.name}')" title="Logs">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        </button>
                        <button class="settings-btn gear-btn" onclick="openSettings('${s.id}')" title="Settings">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        </button>
                        <div class="status-indicator"></div>
                    </div>
                </div>
                <div class="service-actions">
                    <button class="btn primary" style="flex:1;" onclick="toggleService('${s.id}')" ${btnDisabled}>${btnText}</button>
                    ${(isStarting||isStopping||isRunning) ? `<button class="btn force-stop-btn" onclick="forceStop('${s.id}')" title="Force Kill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>` : ''}
                    ${quickLinks}
                </div>
                ${isCrashed ? `<div class="crash-banner"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Service crashed unexpectedly. <button class="btn primary" style="padding:0.25rem 0.75rem;font-size:0.8rem;" onclick="toggleService('${s.id}')">Restart</button></div>` : ''}
            `;
            grid.appendChild(card);
        });
    }

    // ── Service control ───────────────────────────────────────────────────────
    async function toggleService(id) {
        const isRunning = lastStatus[id]?.running || false;
        pendingStarts.delete(id); pendingStops.delete(id);
        isRunning ? pendingStops.add(id) : pendingStarts.add(id);
        renderServices(lastStatus);
        try {
            const res  = await fetch(`/api/${isRunning ? 'stop' : 'start'}/${id}`, { method:'POST' });
            const data = await res.json();
            if (!res.ok) {
                showToast(data.error || 'Failed', true);
                pendingStarts.delete(id); pendingStops.delete(id);
                renderServices(lastStatus);
            } else {
                const name = services.find(s=>s.id===id)?.name || id;
                showToast(isRunning ? `Stopping ${name}…` : `Starting ${name}…`);
            }
        } catch(e) {
            showToast('Connection error', true);
            pendingStarts.delete(id); pendingStops.delete(id);
            renderServices(lastStatus);
        }
    }

    async function forceStop(id) {
        pendingStarts.delete(id); pendingStops.delete(id);
        showToast(`Force killing ${id}…`);
        try { await fetch(`/api/stop/${id}`, { method:'POST' }); } catch(e) {}
        lastRenderKey = '';
        setTimeout(fetchStatus, 800);
    }

    // ── Settings modal ────────────────────────────────────────────────────────
    async function openSettings(serviceId) {
        await Promise.all([fetchConfig(), fetchTextModels(), fetchAudioModels(), fetchVulkanDevices()]);
        currentEditingService = serviceId;
        const svc   = services.find(s => s.id === serviceId);
        const modal = document.getElementById('settings-modal');
        document.getElementById('settings-title').innerText = `${svc?.name || serviceId} — Settings`;
        const body  = document.getElementById('settings-body');
        const conf  = appConfig[serviceId] || {};

        if (serviceId === 'llama') {
            const modelOpts = textModels.map(m => `<option value="${m}" ${conf.model===m?'selected':''}>${m}</option>`).join('');
            // Build compute backend options
            const backend   = conf.compute_backend || 'vulkan:0';
            const backendOpts = vulkanDevices.map(d => {
                const val = d.value || (d.index === -1 ? 'cpu' : `vulkan:${d.index}`);
                return `<option value="${val}" ${backend===val?'selected':''}>${d.name}</option>`;
            }).join('');
            body.innerHTML = `
                <label>Model</label>
                <select name="model" class="model-select" style="margin-bottom:0.5rem;">${modelOpts}</select>
                <label>Compute Backend</label>
                <select name="compute_backend" class="model-select" style="margin-bottom:0.5rem;">${backendOpts}</select>
                <label>Context Size (tokens)</label>
                <input type="number" name="ctx_size" value="${conf.ctx_size||4096}" class="model-select" style="margin-bottom:0.5rem;">
                <label>Threads</label>
                <input type="number" name="threads" value="${conf.threads||4}" class="model-select" style="margin-bottom:0.5rem;">
                <label>Port</label>
                <input type="number" name="port" value="${conf.port||8080}" class="model-select">
            `;
        } else if (serviceId === 'text2speach') {
            const modelOpts = audioModels.map(m => `<option value="${m}" ${conf.model===m?'selected':''}>${m}</option>`).join('');
            const backend   = conf.compute_backend || 'vulkan:0';
            const backendOpts = vulkanDevices.map(d => {
                const val = d.value || (d.index === -1 ? 'cpu' : `vulkan:${d.index}`);
                return `<option value="${val}" ${backend===val?'selected':''}>${d.name}</option>`;
            }).join('');
            body.innerHTML = `
                <label>Model</label>
                <select name="model" class="model-select" style="margin-bottom:0.5rem;">${modelOpts}</select>
                <label>Compute Backend</label>
                <select name="compute_backend" class="model-select" style="margin-bottom:0.5rem;">${backendOpts}</select>
                <label>Context Size (tokens)</label>
                <input type="number" name="ctx_size" value="${conf.ctx_size||1024}" class="model-select" style="margin-bottom:0.5rem;">
                <label>Threads</label>
                <input type="number" name="threads" value="${conf.threads||4}" class="model-select" style="margin-bottom:0.5rem;">
                <label>Port</label>
                <input type="number" name="port" value="${conf.port||8090}" class="model-select">
            `;
        } else if (serviceId === 'comfyui') {
            body.innerHTML = `
                <label style="display:flex;align-items:center;gap:0.5rem;">
                    <input type="checkbox" name="lowvram" ${conf.lowvram?'checked':''}> Use --lowvram (recommended for 4GB)
                </label>
                <label style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;">
                    <input type="checkbox" name="normalvram" ${conf.normalvram?'checked':''}> Use --normalvram
                </label>
            `;
        } else {
            body.innerHTML = '<p style="color:var(--text-muted);">No settings for this service.</p>';
        }
        modal.showModal();
    }

    async function saveSettings() {
        if (!currentEditingService) return;
        const body    = document.getElementById('settings-body');
        let newConfig = { ...appConfig };
        if (!newConfig[currentEditingService]) newConfig[currentEditingService] = {};
        body.querySelectorAll('input, select').forEach(el => {
            if (el.type === 'checkbox') newConfig[currentEditingService][el.name] = el.checked;
            else newConfig[currentEditingService][el.name] = isNaN(el.value) || el.tagName === 'SELECT' ? el.value : Number(el.value);
        });
        try {
            await fetch('/api/config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(newConfig) });
            appConfig = newConfig;
            document.getElementById('settings-modal').close();
            showToast('Settings saved!');
            lastRenderKey = '';   // force re-render so model badge updates
            renderServices(lastStatus);
        } catch(e) { showToast('Error saving', true); }
    }

    init();
</script>
{% endblock %}
