<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos AI Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' stroke='%23a3e635' stroke-width='8' stroke-dasharray='200 280' stroke-linecap='round' transform='rotate(45 50 50)'/><circle cx='50' cy='50' r='28' stroke='%23f97316' stroke-width='8' stroke-dasharray='100 180' stroke-linecap='round' transform='rotate(225 50 50)'/><circle cx='50' cy='50' r='10' fill='%23a3e635'/></svg>">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="app-layout">
        <nav class="sidebar">
            <div class="nav-brand">
                <svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="44" stroke="#a3e635" stroke-width="8" stroke-dasharray="200 280" stroke-linecap="round" transform="rotate(45 50 50)"/>
                    <circle cx="50" cy="50" r="28" stroke="#f97316" stroke-width="8" stroke-dasharray="100 180" stroke-linecap="round" transform="rotate(225 50 50)"/>
                    <circle cx="50" cy="50" r="10" fill="#a3e635"/>
                </svg>
            </div>
            <div class="nav-links">
                <!-- Dashboard -->
                <a href="/" class="nav-icon {% if request.path == '/' %}active{% endif %}" title="Dashboard">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </a>
                <!-- Chat -->
                <a href="/chat" class="nav-icon {% if request.path == '/chat' %}active{% endif %}" title="Chat">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                </a>
                <!-- TTS -->
                <a href="/tts" class="nav-icon {% if request.path == '/tts' %}active{% endif %}" title="Text to Speech">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </a>
                <!-- Model Hub -->
                <a href="/models" class="nav-icon {% if request.path == '/models' %}active{% endif %}" title="Model Hub">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </a>
            </div>
            <div class="nav-bottom">
                <a href="#" class="nav-icon" title="Toggle Theme" onclick="cycleTheme(); return false;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
                </a>
            </div>
        </nav>

        <main class="main-content">
            <svg class="bg-watermark" width="600" height="600" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="44" stroke="#a3e635" stroke-width="2" stroke-dasharray="200 280" stroke-linecap="round" transform="rotate(45 50 50)"/>
                <circle cx="50" cy="50" r="28" stroke="#f97316" stroke-width="2" stroke-dasharray="100 180" stroke-linecap="round" transform="rotate(225 50 50)"/>
                <circle cx="50" cy="50" r="10" fill="#a3e635" fill-opacity="0.2"/>
            </svg>
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <!-- Split View Logs Panel -->
        <aside id="log-panel" class="log-panel">
            <div class="log-header">
                <h3 id="log-title">Service Logs</h3>
                <div style="display:flex;gap:0.5rem;align-items:center;">
                    <button class="close-logs-btn" onclick="clearLogs()" title="Clear" style="opacity:0.6;font-size:0.75rem;padding:0.25rem 0.6rem;border-radius:4px;">Clear</button>
                    <button class="close-logs-btn" onclick="closeLogs()" title="Close">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <pre id="log-content" class="log-content">Select a service to view its logs...</pre>
        </aside>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // ── Toast ──────────────────────────────────────────────────────────────
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${isError ? 'error' : ''} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 3500);
        }

        // ── Logs ───────────────────────────────────────────────────────────────
        let currentLogService = null;
        let logPollInterval   = null;

        function toggleLogs(serviceId, serviceName) {
            const panel = document.getElementById('log-panel');
            const title = document.getElementById('log-title');
            if (panel.classList.contains('open') && currentLogService === serviceId) {
                closeLogs(); return;
            }
            currentLogService = serviceId;
            title.innerText   = `${serviceName || serviceId} — Logs`;
            panel.classList.add('open');
            document.getElementById('log-content').innerText = 'Loading…';
            if (logPollInterval) clearInterval(logPollInterval);
            fetchLogs();
            logPollInterval = setInterval(fetchLogs, 2000);
        }

        async function fetchLogs() {
            if (!currentLogService) return;
            try {
                const res  = await fetch(`/api/logs/${currentLogService}`);
                const data = await res.json();
                const el   = document.getElementById('log-content');
                const near = el.scrollHeight - el.clientHeight <= el.scrollTop + 60;
                el.innerHTML = data.logs ? parseANSI(data.logs) : '<span style="opacity:0.4">No logs yet.</span>';
                if (near) el.scrollTop = el.scrollHeight;
            } catch (e) { console.error('Log fetch error', e); }
        }

        function closeLogs() {
            document.getElementById('log-panel').classList.remove('open');
            if (logPollInterval) clearInterval(logPollInterval);
            currentLogService = null;
        }

        function clearLogs() {
            document.getElementById('log-content').innerHTML = '<span style="opacity:0.4">Cleared.</span>';
        }

        // ── ANSI parser ────────────────────────────────────────────────────────
        function parseANSI(str) {
            let s = str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            const map = {
                '30':'#4a4a4a','31':'var(--danger)','32':'var(--success)',
                '33':'#eab308','34':'#60a5fa','35':'#d946ef',
                '36':'var(--primary)','37':'var(--text-main)'
            };
            let open = false;
            s = s.replace(/\x1b\[([0-9;]*)m/g, (_, p1) => {
                const codes = p1 ? p1.split(';') : ['0'];
                const col   = codes.find(c => map[c]);
                const bold  = codes.includes('1');
                let out = open ? '</span>' : '';
                if (!p1 || p1 === '0') { open = false; return out; }
                if (col) { open = true; return out + `<span style="color:${map[col]};font-weight:${bold?'bold':'normal'}">`; }
                return out;
            });
            return open ? s + '</span>' : s;
        }

        // ── Themes ─────────────────────────────────────────────────────────────
        const themes = ['default', 'nord', 'gruvbox', 'tokyo-night'];
        let currentThemeIndex = 0;

        function applyTheme(name) {
            document.documentElement.setAttribute('data-theme', name);
            localStorage.setItem('ui-theme', name);
        }
        function cycleTheme() {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
            showToast(`Theme: ${themes[currentThemeIndex]}`);
        }

        const saved = localStorage.getItem('ui-theme');
        if (saved) {
            currentThemeIndex = Math.max(0, themes.indexOf(saved));
            applyTheme(themes[currentThemeIndex]);
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
